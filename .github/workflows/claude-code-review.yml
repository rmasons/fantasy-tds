name: Claude Code Review

# Advisory fresh-context review for work landing on dev (feature -> dev). The
# runner starts clean each time, so Claude judges the diff on its merits. This
# review only COMMENTS; it never blocks. Promotions (dev -> test, test -> main)
# go through the stricter, blocking promotion-review.yml instead.
on:
  pull_request:
    types: [opened, synchronize]
    branches: [dev]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          # --- Auth: exactly ONE of these must exist as a repo secret. ---
          # The bootstrap script (setup.sh) helps you set it.
          # Default = Claude subscription token (Pro/Max), from `claude setup-token`:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Anthropic API key (pay-as-you-go) instead — comment the line above,
          # uncomment this, and store a console.anthropic.com key as the secret:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          prompt: |
            Review pull request #${{ github.event.pull_request.number }} with
            fresh eyes. You have NOT seen the conversation or reasoning that
            produced this code — judge it on its merits, do not assume the
            author's intent was correct.

            This runs non-interactively in CI: do NOT ask the user anything, do
            NOT run `gh pr list`, and review ONLY PR #${{ github.event.pull_request.number }}.
            Get the diff with `gh pr diff ${{ github.event.pull_request.number }}`
            and read changed files in the checked-out working tree as needed.

            Focus on, in priority order:
            - Correctness and bugs (logic errors, off-by-one, wrong assumptions)
            - Security (injection, hardcoded secrets, auth gaps, unsafe input)
            - Error handling and edge cases
            - Performance problems that matter
            - Readability and consistency with the surrounding code

            Use the inline comment tool (confirmed: true) to flag specific lines,
            and `gh pr comment ${{ github.event.pull_request.number }} --body "..."`
            for one short top-level summary. Be concrete and concise: skip
            nitpicks, style-only opinions, and praise. If the PR looks clean, say
            so briefly rather than inventing issues.
          claude_args: |
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
